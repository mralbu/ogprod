name: Live smoke test

# Publishers drift off their endpoints without notice; this catches it weekly
# instead of when a user hits it. See tests/test_live_smoke.py.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m live -v
