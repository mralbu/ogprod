[project]
name = "ogprod"
version = "0.1.0"
description = "Public oil & gas production data pipeline and geospatial store."
readme = "README.md"
authors = [{ name = "mralbu", email = "1636597+mralbu@users.noreply.github.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.3",
    "duckdb>=2.0.1",
    "geopandas>=1.2.0",
    "httpx2>=2.0",
    "pyarrow>=26.0.1",
]

[project.scripts]
ogprod = "ogprod.cli:main"

[project.urls]
Repository = "https://github.com/mralbu/ogprod"

[dependency-groups]
dev = [
    "coverage>=7.16",
    "griffe>=2.4",
    "hypothesis>=6.170",
    "prek>=0.5.5",
    "pytest>=9.1",
    "radon>=6.0",
    "ruff>=0.17",
    "ty>=0.0.86",
    "vulture>=2.16",
]
publish = [
    "huggingface-hub>=0.27",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C90", # mccabe (cyclomatic complexity)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
# assert is for invariants and type narrowing, never for checks that must survive python -O
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.vulture]
paths = ["src", "scripts", "tests"]
ignore_decorators = ["@*.command", "@*.group"] # click registers these, nothing calls them

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
minversion = "9.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["ogprod"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
