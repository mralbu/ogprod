[project]
name = "ogprod"
version = "0.1.0"
description = "Organize public oil & gas production data (well- and field-level) from regulators worldwide"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Marcelo Albuquerque" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["oil", "gas", "production", "energy", "open-data", "geospatial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pandas>=2.0",
    "httpx>=0.27",
    "geopandas>=1.0",
    "duckdb>=1.1",
    "pyarrow>=17",
]

[project.urls]
Repository = "https://github.com/mralbu/ogprod"
Documentation = "https://github.com/mralbu/ogprod/tree/main/docs"
Issues = "https://github.com/mralbu/ogprod/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "ty",
]
notebooks = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ogprod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
