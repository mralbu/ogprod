[project]
name = "ogprod"
version = "0.1.0"
description = "Organize public oil & gas production data (well- and field-level) from regulators worldwide"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Marcelo Albuquerque" }]
dependencies = [
    "pandas>=2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "ty",
]
notebooks = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ogprod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
